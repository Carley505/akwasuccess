name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate placeholder PDFs & setup local PGlite DB
        run: |
          npm run assets:placeholders
          npm run db:setup

      - name: Lint, Typecheck & Unit tests
        run: npm run check

      - name: Build production Next.js app
        run: npm run build

      - name: Install Playwright Chromium & run E2E + axe accessibility suite
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
